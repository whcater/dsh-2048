<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="2048 game icon">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3b2a3"/>
      <stop offset="1" stop-color="#9f8776"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#e9b949"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3d2b1c" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#board)"/>
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="4"/>
  <g filter="url(#soft)">
    <rect x="64" y="64" width="180" height="180" rx="36" fill="#f3e9dc"/>
    <rect x="268" y="64" width="180" height="180" rx="36" fill="#efe0c8"/>
    <rect x="64" y="268" width="180" height="180" rx="36" fill="#f2b179"/>
    <rect x="268" y="268" width="180" height="180" rx="36" fill="url(#gold)"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" text-anchor="middle">
    <text x="154" y="198" font-size="108" fill="#776e65">2</text>
    <text x="358" y="198" font-size="108" fill="#776e65">4</text>
    <text x="154" y="402" font-size="108" fill="#fff8ef">8</text>
    <text x="358" y="402" font-size="108" fill="#fff8ef">16</text>
  </g>
</svg>
